<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STTech Contrast Master Quiz - Đối Đầu Cặp Đôi Dễ Nhầm Lẫn</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 780px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .quiz-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-purple);
        }

        .score-board {
            font-size: 0.95rem;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            width: 0%;
            transition: width 0.3s ease;
        }

        .contrast-badge {
            display: inline-block;
            background-color: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #0f172a;
            border: 1.5px solid #334155;
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.98rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-purple);
            background-color: #1e293b;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #064e3b !important;
            border-color: var(--accent-green) !important;
            color: #a7f3d0 !important;
        }

        .option-btn.incorrect {
            background-color: #7f1d1d !important;
            border-color: var(--accent-red) !important;
            color: #fecaca !important;
        }

        .explanation-box {
            background-color: #0f172a;
            border-left: 4px solid var(--accent-purple);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text-sub);
            margin-top: 15px;
            display: none;
        }

        .next-btn {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            float: right;
            display: none;
        }

        .next-btn:hover {
            background-color: #7c3aed;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-green);
            margin: 15px 0;
        }

        .restart-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <script src="engine.js"></script>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="quiz-header">
            <div class="quiz-title">⚡ Speed-Run Contrast Quiz (20 Câu)</div>
            <div class="score-board">Câu <span id="current-q">1</span>/20 | Điểm: <span id="current-score">0</span></div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="contrast-badge" id="contrast-badge">Cặp đối đầu: ...</div>
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>⚔️ HOÀN THÀNH SPEED-RUN CONTRAST QUIZ!</h2>
        <p>Bạn đã chinh phục bộ câu hỏi đối đầu phân biệt các cặp phần mềm dễ nhầm lẫn nhất trong hệ sinh thái STTech.</p>
        <div class="result-score"><span id="final-score">0</span> / 20</div>
        <p id="result-comment"></p>
        <button class="restart-btn" onclick="restartQuiz()">Luyện lại ngay để làm chủ 100%</button>
    </div>
</div>

        q: "Trợ lý AI trả lời tự động thắc mắc về tuyển sinh và học bạ số nằm trên giải pháp nào?",
        options: [
            "A. ST-EMS",
            "B. EDU (EduPortal AI)",
            "C. ST-AMS",
            "D. ST-ETEST"
        ],
        answer: 1,
        exp: "<b>EduPortal AI (EDU)</b> tích hợp Trợ lý AI giải đáp thắc mắc thủ tục hành chính công khai."
    },
    {
        pair: "ST-KPI vs ST-CEMS",
        q: "Phần mềm nào chấm điểm đánh giá cả TẬP THỂ phòng ban lẫn CÁ NHÂN công chức?",
        options: [
            "A. ST-CEMS - Vì đánh giá giáo viên.",
            "B. ST-KPI - Vì là Phần mềm Đánh giá xếp loại chất lượng tập thể và cá nhân.",
            "C. ST-LIB - Vì đánh giá thư viện.",
            "D. ST-ETEST - Vì chấm điểm thi."
        ],
        answer: 1,
        exp: "<b>ST-KPI</b> thực hiện Đánh giá xếp loại chất lượng cho cả TẬP THỂ đơn vị và CÁ NHÂN công chức/viên chức."
    }
];

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const qData = quizData[currentQ];
    document.getElementById("current-q").innerText = currentQ + 1;
    document.getElementById("current-score").innerText = score;
    document.getElementById("contrast-badge").innerText = `⚔️ Cặp đối đầu: ${qData.pair}`;
    document.getElementById("question-text").innerText = `Câu ${currentQ + 1}: ${qData.q}`;
    
    const progressPercent = ((currentQ + 1) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    const optionsGrid = document.getElementById("options-grid");
    optionsGrid.innerHTML = "";

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });

    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(index) {
    if (answered) return;
    answered = true;

    const qData = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach((btn) => btn.disabled = true);

    if (index === qData.answer) {
        buttons[index].classList.add("correct");
        score++;
        document.getElementById("current-score").innerText = score;
    } else {
        buttons[index].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
    }

    const expBox = document.getElementById("explanation-box");
    expBox.innerHTML = `💡 <b>Phân tích điểm khác biệt:</b> ${qData.exp}`;
    expBox.style.display = "block";

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let comment = "";
    if (score === 20) comment = "🔥 BẬC THẦY BẮT BỆNH SẢN PHẨM! Bạn phân biệt chính xác 100% tất cả các cặp phần mềm dễ nhầm lẫn nhất!";
    else if (score >= 16) comment = "👏 RẤT GIỎI! Tư duy phản xạ phân biệt sản phẩm của bạn đã đạt trên 80%.";
    else if (score >= 12) comment = "👍 KHÁ TỐT! Bạn nắm chắc các phần mềm chính, cần chú ý thêm cặp ST-TMIS vs ST-CEMS và ST-BHR vs HRS.";
    else comment = "💪 NỔ LỰC HƠN! Làm lại bài kiểm tra đối đầu này 1 lần nữa để khắc sâu ranh giới tính năng nhé!";

    document.getElementById("result-comment").innerText = comment;
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

loadQuestion();
</script>
