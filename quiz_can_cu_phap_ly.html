            font-weight: 600;
            line-height: 1.5;

            background-color: #0f172a;
            border: 1.5px solid #334155;

            border-radius: 10px;
            font-size: 0.95rem;
            text-align: left;

            border-color: var(--accent-purple);
            background-color: #1e293b;
            transform: translateY(-2px);
        }

            background-color: #064e3b !important;

            color: #a7f3d0 !important;
        }

            border-radius: 6px;
            font-size: 0.92rem;

            color: var(--text-sub);
            margin-top: 15px;

            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            float: right;
            display: none;
        }

        .next-btn:hover {

        }

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const qData = quizData[currentQ];
    document.getElementById("current-q").innerText = currentQ + 1;
    document.getElementById("current-score").innerText = score;
    document.getElementById("question-text").innerText = `Câu ${currentQ + 1}: ${qData.q}`;
    
    const progressPercent = ((currentQ + 1) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    const optionsGrid = document.getElementById("options-grid");
    optionsGrid.innerHTML = "";

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });

    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(index) {
    if (answered) return;
    answered = true;

    const qData = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach((btn) => btn.disabled = true);

    if (index === qData.answer) {
        buttons[index].classList.add("correct");
        score++;
        document.getElementById("current-score").innerText = score;
    } else {
        buttons[index].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
    }

    const expBox = document.getElementById("explanation-box");
    expBox.innerHTML = `⚖️ <b>Căn cứ & Chú thích chuyên sâu:</b> ${qData.exp}`;
    expBox.style.display = "block";

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let comment = "";
    if (score === 30) comment = "👑 BẬC THẦY PHÁP LÝ SẢN PHẨM! Bạn đã làm chủ 100% căn cứ pháp lý và quy chuẩn của 15 phần mềm STTech!";
    else if (score >= 24) comment = "🥇 XUẤT SẮC! Bạn nắm rất vững các Nghị định, Thông tư và Quyết định. Sẵn sàng đi tư vấn dự án!";
    else if (score >= 18) comment = "🥈 KHÁ TỐT! Đã nắm được các khung pháp lý chính, cần xem lại các Quyết định DTI và Thông tư chuyên ngành.";
    else comment = "📘 CỐ LÊN! Đọc lại bảng Ma trận Căn cứ Pháp lý trong Báo cáo Thu hoạch và thử sức lại nhé!";

    document.getElementById("result-comment").innerText = comment;
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

loadQuestion();
