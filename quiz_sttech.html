    <style>
        :root {

        }

            padding: 20px;

            align-items: center;

        }

        .quiz-container {
            background-color: var(--card-bg);

            width: 100%;
            max-width: 750px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

            display: flex;

            font-weight: bold;
            color: var(--accent-blue);
        }

            font-size: 0.95rem;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

            width: 100%;

            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;

        }

            height: 100%;

        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

            background-color: #0f172a;
            border: 1.5px solid #334155;
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.98rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            background-color: #1e293b;
            transform: translateY(-2px);
        }

            background-color: #064e3b !important;
            border-color: var(--accent-green) !important;
            color: #a7f3d0 !important;
        }

        .option-btn.incorrect {
            background-color: #7f1d1d !important;
            border-color: var(--accent-red) !important;
            color: #fecaca !important;
        }

            background-color: #0f172a;
            border-left: 4px solid var(--accent-blue);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text-sub);
            margin-top: 15px;
            display: none;

            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            float: right;
            display: none;
        }

        }

</head>

        ],
        answer: 0,
        exp: "Đó là <b>ST-KPI</b> (Phần mềm Đánh giá xếp loại chất lượng tập thể và cá nhân công chức, viên chức)."
    },

        options: [

    },

        options: [
            "A. 10 phần mềm",

            "D. 20 phần mềm"
        ],
        answer: 2,
        exp: "Hệ sinh thái STTech bao gồm đầy đủ <b>15 phần mềm/giải pháp</b> chia làm 4 trụ cột nghiệp vụ."
    }

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const qData = quizData[currentQ];
    document.getElementById("current-q").innerText = currentQ + 1;
    document.getElementById("current-score").innerText = score;
    document.getElementById("question-text").innerText = `Câu ${currentQ + 1}: ${qData.q}`;
    
    const progressPercent = ((currentQ + 1) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    const optionsGrid = document.getElementById("options-grid");
    optionsGrid.innerHTML = "";

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });

    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(index) {
    if (answered) return;
    answered = true;

    const qData = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach((btn) => btn.disabled = true);

    if (index === qData.answer) {
        buttons[index].classList.add("correct");
        score++;
        document.getElementById("current-score").innerText = score;
    } else {
        buttons[index].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
    }

    const expBox = document.getElementById("explanation-box");
    expBox.innerHTML = `💡 <b>Ghi nhớ / Chú thích:</b> ${qData.exp}`;
    expBox.style.display = "block";

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let comment = "";
    if (score === 30) comment = "🔥 XUẤT SẮC TẬP TRUNG! Bạn đã thuộc lòng 100% tên viết tắt và chức năng của 15 phần mềm STTech!";
    else if (score >= 24) comment = "👏 RẤT TỐT! Bạn đã nắm vững trên 80% kiến thức. Hãy làm lại 1 lần nữa để đạt điểm tuyệt đối!";
    else if (score >= 18) comment = "👍 KHÁ TỐT! Bạn đã nhớ được các ứng dụng chính, cần rèn luyện thêm các cặp tên dễ nhầm lẫn.";
    else comment = "💪 CỐ LÊN! Đọc lại Mẹo ghi nhớ 4 cụm từ gốc và làm lại bài thi để ghi nhớ sâu hơn nhé!";

    document.getElementById("result-comment").innerText = comment;
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

// Khởi chạy câu hỏi đầu tiên khi tải trang
loadQuestion();
</script>
