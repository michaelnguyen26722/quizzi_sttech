<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STTech Scenario Quiz - 25 Tình Huống Thực Tế & Bài Toán Khách Hàng</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .quiz-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .score-board {
            font-size: 0.95rem;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        .scenario-badge {
            display: inline-block;
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #0f172a;
            border: 1.5px solid #334155;
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.96rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            background-color: #1e293b;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #064e3b !important;
            border-color: var(--accent-green) !important;
            color: #a7f3d0 !important;
        }

        .option-btn.incorrect {
            background-color: #7f1d1d !important;
            border-color: var(--accent-red) !important;
            color: #fecaca !important;
        }

        .explanation-box {
            background-color: #0f172a;
            border-left: 4px solid var(--accent-blue);
            padding: 16px;
            border-radius: 6px;
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text-sub);
            margin-top: 15px;
            display: none;
        }

        .next-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            float: right;
            display: none;
        }

        .next-btn:hover {
            background-color: #2563eb;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-green);
            margin: 15px 0;
        }

        .restart-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="quiz-header">
            <div class="quiz-title">🎯 STTech Scenario & Consultation Quiz</div>
            <div class="score-board">Câu <span id="current-q">1</span>/25 | Điểm: <span id="current-score">0</span></div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="scenario-badge" id="scenario-badge">TÌNH HUỐNG THỰC TẾ</div>
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>🎉 HOÀN THÀNH BÀI TƯ VẤN GIẢI PHÁP!</h2>
        <p>Bạn đã giải quyết xong 25 bài toán thực tế của Khách hàng trong Hệ sinh thái STTech.</p>
        <div class="result-score"><span id="final-score">0</span> / 25</div>
        <p id="result-comment"></p>
        <button class="restart-btn" onclick="restartQuiz()">Làm lại bài thi (Rèn luyện phản xạ)</button>
    </div>
</div>

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const qData = quizData[currentQ];
    document.getElementById("current-q").innerText = currentQ + 1;
    document.getElementById("current-score").innerText = score;
    document.getElementById("scenario-badge").innerText = qData.badge;
    document.getElementById("question-text").innerText = qData.q;
    
    const progressPercent = ((currentQ + 1) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    const optionsGrid = document.getElementById("options-grid");
    optionsGrid.innerHTML = "";

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsGrid.appendChild(btn);
    });

    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(index) {
    if (answered) return;
    answered = true;

    const qData = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach((btn) => btn.disabled = true);

    if (index === qData.answer) {
        buttons[index].classList.add("correct");
        score++;
        document.getElementById("current-score").innerText = score;
    } else {
        buttons[index].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
    }

    const expBox = document.getElementById("explanation-box");
    expBox.innerHTML = `💡 <b>Tư vấn / Giải thích nghiệp vụ:</b> ${qData.exp}`;
    expBox.style.display = "block";

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let comment = "";
    if (score === 25) comment = "🏆 TƯ VẤN VIÊN XUẤT SẮC! Bạn đã nắm vững 100% nghiệp vụ và bài toán thực tế của cả 15 phần mềm STTech!";
    else if (score >= 20) comment = "👏 NĂNG LỰC RẤT TỐT! Bạn đã sẵn sàng tư vấn giải pháp và làm việc trực tiếp với Khách hàng/Sếp.";
    else if (score >= 15) comment = "👍 KHÁ TỐT! Bạn hiểu được các bài toán chính, hãy xem lại các tình huống về DMS, SMS và EDIS nhé.";
    else comment = "💪 CỐ LÊN! Làm lại bài kiểm tra 1 lần nữa để nâng cao phản xạ tư vấn tình huống thực tế!";

    document.getElementById("result-comment").innerText = comment;
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

loadQuestion();
