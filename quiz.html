<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizizz STTech Ecosystem</title>
    <!-- Nhúng Google Font & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Nhúng thư viện Canvas Confetti tạo hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #8854c0;
            --primary-dark: #6c3ca1;
            --background: #2d1b4e;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --correct: #26d07c;
            --incorrect: #ff3366;
            --shadow-3d: 0 8px 0 #bc9be4, 0 15px 20px rgba(0,0,0,0.3);
            --btn-shadow: 0 5px 0 var(--primary-dark);
            --option-shadow: 0 4px 0 #e0e0e0;
        }

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: all 0.2s ease; }
        body { background: var(--background); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }

        .quiz-container {
            background: var(--card-bg);
            max-width: 750px;
            width: 100%;
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow-3d);
            transform: translateY(-5px);
            position: relative;
        }

        h1 { font-family: 'Fredoka One', cursive; color: var(--primary); text-align: center; margin-top: 0; font-size: 2.2rem; text-shadow: 2px 2px 0px #ebdcf9; letter-spacing: 1px; }
        .description { text-align: center; color: #666; margin-bottom: 25px; font-weight: 500; }

        .progress-container { background: #eee; height: 16px; border-radius: 10px; margin-bottom: 30px; position: relative; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        .progress-bar { background: linear-gradient(90deg, #a478dc, var(--primary)); height: 100%; width: 0%; border-radius: 10px; }
        .stats { display: flex; justify-content: space-between; font-weight: 700; color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; }

        .question-box { background: #f8f5fd; padding: 25px; border-radius: 18px; border: 2px dashed var(--primary); margin-bottom: 25px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .question-text { font-size: 1.3rem; font-weight: 700; color: var(--text-main); text-align: center; line-height: 1.5; }
        .software-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #ffaa00; color: white; padding: 4px 15px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; box-shadow: 0 4px 0 #cc8800; }

        .options-grid { display: grid; grid-template-columns: 100%; gap: 15px; margin-bottom: 25px; }
        .option-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 18px 22px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: var(--option-shadow);
            position: relative;
        }
        .option-card:hover:not(.disabled) { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 7px 0 #bc9be4; background-color: #faf7fd; }
        .option-card:active:not(.disabled) { transform: translateY(1px); box-shadow: 0 3px 0 #bc9be4; }
        .option-prefix { font-family: 'Fredoka One', cursive; margin-right: 15px; color: #a478dc; background: #f0e6fc; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 0.95rem; }

        .option-card.correct { background-color: #e8fcf2 !important; border-color: var(--correct) !important; color: #0f6e3f !important; box-shadow: 0 4px 0 #1b9458 !important; }
        .option-card.correct .option-prefix { background-color: var(--correct); color: white; }
        .option-card.incorrect { background-color: #ffebeb !important; border-color: var(--incorrect) !important; color: #b31237 !important; box-shadow: 0 4px 0 #bd1a42 !important; }
        .option-card.incorrect .option-prefix { background-color: var(--incorrect); color: white; }
        .option-card.disabled { cursor: not-allowed; pointer-events: none; }

        .explanation-box { background: #fff8e7; border-left: 5px solid #ffaa00; border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; display: none; animation: fadeIn 0.4s ease; }
        .explanation-title { font-weight: 700; color: #b37400; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .explanation-text { color: #555; line-height: 1.5; font-size: 0.95rem; }

        .actions-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            text-align: center;
        }
        .actions-btn:hover { background: #7946b2; }
        .actions-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }

        .result-screen { text-align: center; display: none; padding: 20px 0; }
        .result-icon { font-size: 5rem; color: #ffaa00; margin-bottom: 20px; animation: bounce 1s infinite alternate; }
        .score-big { font-family: 'Fredoka One', cursive; font-size: 3.5rem; color: var(--primary); margin: 15px 0; text-shadow: 3px 3px 0px #ebdcf9; }
        .score-comment { font-size: 1.3rem; font-weight: 700; color: #444; margin-bottom: 30px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Màn hình làm bài -->
        <div id="quiz-screen">
            <h1 id="main-title">Quizizz STTech</h1>
            <div class="description" id="main-desc">Đang xử lý dữ liệu...</div>
            
            <div class="stats">
                <span id="progress-text">Câu hỏi 1/40</span>
                <span id="score-text">Đúng: 0</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div style="position: relative;">
                <div class="software-badge" id="soft-badge">ST-EMS</div>
                <div class="question-box">
                    <div class="question-text" id="q-text">Nội dung câu hỏi đang tải...</div>
                </div>
            </div>

            <div class="options-grid" id="options-box">
                <!-- Các đáp án sinh tự động bằng JS -->
            </div>

            <div class="explanation-box" id="explain-box">
                <div class="explanation-title"><i class="fa-solid fa-lightbulb"></i> Đáp án & Giải thích độc quyền:</div>
                <div class="explanation-text" id="explain-text">Nội dung giải thích...</div>
            </div>

            <button class="actions-btn" id="next-btn" onclick="handleNextStep()" style="display: none;">Câu Tiếp Theo <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Màn hình kết quả -->
        <div class="result-screen" id="result-screen">
            <div class="result-icon"><i class="fa-solid fa-trophy"></i></div>
            <h1>Chiến Thắng Hoàn Toàn!</h1>
            <p style="color: #666; font-size: 1.1rem;">Bạn đã hoàn thành bộ ôn tập 15 Phần mềm thuộc Hệ sinh thái STTech</p>
            <div class="score-big" id="final-score">00/40</div>
            <div class="score-comment" id="final-comment">Tuyệt vời ông mặt trời!</div>
            <button class="actions-btn" onclick="restartQuiz()"><i class="fa-solid fa-rotate-right"></i> Thử Thách Lại Từ Đầu</button>
        </div>
    </div>

              "explanation": "DTI là Nền tảng đánh giá Chuyển đổi số ngành Giáo dục cấp tỉnh, giúp lãnh đạo theo dõi Dashboard xếp hạng CĐS thời gian thực."
            }
        ];

        let currentIndex = 0;
        let userScore = 0;
        let isAnswered = false;

        const screenQuiz = document.getElementById('quiz-screen');
        const screenResult = document.getElementById('result-screen');
        const textQ = document.getElementById('q-text');
        const boxOptions = document.getElementById('options-box');
        const badgeSoft = document.getElementById('soft-badge');
        const textProgress = document.getElementById('progress-text');
        const textScore = document.getElementById('score-text');
        const barProgress = document.getElementById('progress-bar');
        const boxExplain = document.getElementById('explain-box');
        const textExplain = document.getElementById('explain-text');
        const btnNext = document.getElementById('next-btn');

        function initQuiz() {
            document.getElementById('main-desc').innerText = "Học phần ôn tập nhận diện tính năng, mã cốt lõi và căn cứ pháp lý.";
            currentIndex = 0;
            userScore = 0;
            isAnswered = false;
            screenQuiz.style.display = 'block';
            screenResult.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            boxExplain.style.display = 'none';
            btnNext.style.display = 'none';

            let currentData = quizData[currentIndex];

            textProgress.innerText = `Câu hỏi ${currentIndex + 1}/${quizData.length}`;
            textScore.innerText = `Đúng: ${userScore}`;
            barProgress.style.width = `${((currentIndex) / quizData.length) * 100}%`;

            badgeSoft.innerText = currentData.software_code;
            textQ.innerText = currentData.question;

            boxOptions.innerHTML = '';
            currentData.options.forEach((opt) => {
                let prefix = opt.charAt(0);
                let text = opt.substring(3);
                let card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `<span class="option-prefix">${prefix}</span> <span class="option-text-val">${text}</span>`;
                card.setAttribute('data-ans', prefix);
                card.onclick = function() { checkAnswer(card, prefix, currentData.correct_answer, currentData.explanation); };
                boxOptions.appendChild(card);
            });
        }

        function checkAnswer(selectedCard, userAns, correctAns, explainText) {
            if (isAnswered) return;
            isAnswered = true;

            let cards = boxOptions.querySelectorAll('.option-card');
            cards.forEach(c => c.classList.add('disabled'));

            if (userAns === correctAns) {
                selectedCard.classList.add('correct');
                userScore++;
                textScore.innerText = `Đúng: ${userScore}`;
            } else {
                selectedCard.classList.add('incorrect');
                cards.forEach(c => {
                    if (c.getAttribute('data-ans') === correctAns) {
                        c.classList.add('correct');
                    }
                });
            }

            textExplain.innerText = explainText;
            boxExplain.style.display = 'block';
            
            if(currentIndex === quizData.length - 1) {
                btnNext.innerHTML = `Xem Kết Quả Tổng Kết <i class="fa-solid fa-square-poll-vertical"></i>`;
            } else {
                btnNext.innerHTML = `Câu Tiếp Theo <i class="fa-solid fa-arrow-right"></i>`;
            }
            btnNext.style.display = 'block';
        }

        function handleNextStep() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            screenQuiz.style.display = 'none';
            screenResult.style.display = 'block';
            barProgress.style.width = '100%';
            document.getElementById('final-score').innerText = `${userScore}/${quizData.length}`;
            
            let comment = "";
            let percent = (userScore / quizData.length) * 100;
            if(percent === 100) { 
                comment = "Xuất sắc tuyệt đối! Bạn đã làm chủ hoàn toàn hệ sinh thái phần mềm STTech!"; 
                launchConfetti(); 
            } else if(percent >= 80) { 
                comment = "Quá đỉnh! Kiến thức của bạn cực kỳ vững vàng đấy!"; 
                launchConfetti(); 
            } else if(percent >= 50) { 
                comment = "Khá tốt! Đọc kỹ giải thích thêm một chút là hoàn hảo ngay."; 
            } else { 
                comment = "Đừng nản lòng nhé! Hãy thử làm lại lần nữa để ghi nhớ tốt hơn."; 
            }
            document.getElementById('final-comment').innerText = comment;
        }

        function launchConfetti() {
            if (typeof confetti === 'function') {
                var duration = 3 * 1000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.85 } });
                    confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.85 } });
                    if (Date.now() < end) { requestAnimationFrame(frame); }
                }());
            }
        }

        function restartQuiz() {
            initQuiz();
        }

        initQuiz();
    </script>
</body>
</html>
